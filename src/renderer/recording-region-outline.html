<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapora — Region Outline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        pointer-events: none;
      }
      #outline {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 3px solid #ef4444;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.4),
          0 0 0 1px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="outline"></div>
  </body>
</html>
